name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Los tests usan claves ficticias y no crean cuentas ni envían correos (regla 7);
      # esto evita además que el SDK de Clerk envíe telemetría desde el runner.
      CLERK_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json exige >=22.15 (module.registerHooks, que usa tests/app-wiring.test.mjs).
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

  ui:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Los tests usan claves ficticias y no crean cuentas ni envían correos (regla 7);
      # esto evita además que el SDK de Clerk envíe telemetría desde el runner.
      CLERK_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas de interfaz
        run: npm run test:ui

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
