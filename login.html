<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceso · Postava</title>
  <meta name="description" content="Inicia sesión, crea tu cuenta o recupera tu acceso a Postava." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/login.css" />
  <script>
    (() => {
      let pref = "auto";
      try { pref = localStorage.getItem("postava.theme") || "auto"; } catch {}
      const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.themePref = pref;
    })();
  </script>
</head>
<body class="login-page">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="login-nav">
    <a class="nav-brand" href="/" aria-label="Postava, volver al temporizador">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="6" r="3" /><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2" />
        </svg>
      </span>
      <span class="brand-name">Postava</span>
    </a>
    <div class="theme-switch" role="group" aria-label="Tema de la interfaz">
      <button type="button" class="theme-opt" data-theme-set="light" aria-pressed="false" title="Tema claro"><span class="sr-only">Tema claro</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M3.5 12H1.3M22.7 12h-2.2M5.9 5.9 4.4 4.4M19.6 19.6l-1.5-1.5M18.1 5.9l1.5-1.5M4.4 19.6l1.5-1.5"/></svg></button>
      <button type="button" class="theme-opt" data-theme-set="auto" aria-pressed="true" title="Seguir al sistema"><span class="sr-only">Seguir al sistema</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="theme-opt" data-theme-set="dark" aria-pressed="false" title="Tema oscuro"><span class="sr-only">Tema oscuro</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.6 8.6 0 1 0 11 11z"/></svg></button>
    </div>
  </header>
  <main id="main" class="login-main">
    <section class="login-stage" aria-label="Acceso a Postava">
      <div class="login-intro">
        <p class="eyebrow">Tu espacio personal</p>
        <h1>Tu ritmo, siempre contigo</h1>
        <p>Accede a tu cuenta o crea una nueva. El Pomodoro sigue disponible sin registrarte.</p>
      </div>
      <div id="auth-root">
        <div class="auth-loading" role="status"><span class="auth-spinner" aria-hidden="true"></span>Preparando acceso seguro…</div>
      </div>
    </section>
  </main>
  <footer class="login-footer"><a href="/">Volver al Pomodoro sin iniciar sesión</a></footer>
  <script type="module" src="/theme.js"></script>
  <script type="module" src="/auth-entry.jsx"></script>
</body>
</html>
